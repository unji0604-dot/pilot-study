<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 자료 예비조사 - 모집 마감</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f0f2f5; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 20px; box-sizing: border-box; }
  .card { background: #fff; max-width: 560px; width: 100%; border-radius: 12px; padding: 48px 32px;
          text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  h1 { font-size: 22px; color: #1B2A4A; margin: 0 0 16px; }
  p { font-size: 15px; color: #555; line-height: 1.7; margin: 0 0 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>모집이 마감되었습니다</h1>
    <p>목표 인원이 모두 모집되어 본 예비조사는 종료되었습니다.</p>
    <p>관심 가져 주셔서 감사합니다.</p>
  </div>
</body>
</html>
